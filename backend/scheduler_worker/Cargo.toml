[package]
name = "scheduler_worker"
version = "0.1.0"
edition = "2024"

[dependencies]
# For parsing JSON input/output
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# For the genetic algorithm logic
rand = "0.8"        # Random number generation (mutation)
rayon = "1.7"       # Parallelism (multithreading)
chrono = "0.4"      # Time handling (optional, but useful for dates)